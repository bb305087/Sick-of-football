services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sof
      POSTGRES_USER: sof_migrator
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sof_migrator -d sof"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "DATABASE_URL=postgresql+asyncpg://sof_migrator:change-me@db:5432/sof alembic upgrade head && PYTHONPATH=/app python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  postgres_data:
