services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sof
      POSTGRES_USER: sof_migrator
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sof_migrator -d sof"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
